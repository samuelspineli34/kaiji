<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background: #090714;
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        .chest {
            font-size: 110px;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.2s;
        }
        .chest.shake {
            animation: shake 0.6s infinite;
        }
        .chest.open {
            animation: popOpen 0.5s forwards;
        }
        h2 {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
        }
        .reward-reveal {
            display: none;
            margin-top: 25px;
            animation: fadeIn 0.8s forwards;
        }
        .reward-item {
            font-size: 1.3em;
            background: rgba(255,255,255,0.04);
            padding: 20px 40px;
            border-radius: 16px;
        }
        button {
            margin-top: 25px;
            padding: 12px 40px;
            font-size: 1.1em;
            font-weight: bold;
            color: #000;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-transform: uppercase;
        }
        @keyframes shake {
            0% { transform: rotate(0); }
            15% { transform: rotate(-10deg); }
            30% { transform: rotate(10deg); }
            45% { transform: rotate(-10deg); }
            60% { transform: rotate(10deg); }
            100% { transform: rotate(0); }
        }
        @keyframes popOpen {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); opacity: 0.2; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="title">Carregando Baú...</h2>
        <div id="chest" class="chest" onclick="openChest()">🎁</div>
        
        <div id="reveal" class="reward-reveal">
            <div id="rewardCard" class="reward-item"></div>
            <button id="claimBtn" onclick="claim()">Resgatar Prêmios</button>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        let state = null;
        let isOpened = false;

        const rarityColors = { comum: '#8b949e', incomum: '#58a6ff', rara: '#bc8cff', lendaria: '#ffb454' };

        window.addEventListener('message', event => {
            if (event.data.command === 'setupChest') {
                state = event.data;
                const color = rarityColors[state.rarity];
                
                document.getElementById('title').innerText = `BAÚ ${state.rarity.toUpperCase()}`;
                document.getElementById('title').style.color = color;
                document.getElementById('chest').style.filter = `drop-shadow(0 0 25px ${color})`;
            }
        });

        function openChest() {
            if (isOpened || !state) return;
            isOpened = true;

            const chest = document.getElementById('chest');
            chest.classList.add('shake');

            setTimeout(() => {
                chest.classList.remove('shake');
                chest.classList.add('open');
                chest.innerText = "🔓";
                
                const color = rarityColors[state.rarity];
                const card = document.getElementById('rewardCard');
                card.style.border = `2px solid ${color}`;
                card.style.boxShadow = `0 0 20px ${color}30`;
                
                card.innerHTML = `
                    <p style="font-size: 2.2em; margin: 5px 0;">💰 +${state.coinReward} Moedas</p>
                    <p style="margin: 0; color: #ccc;">Decoração de Rarity: <span style="color:${color}; font-weight:bold;">${state.rolledItem.emoji} ${state.rolledItem.name}</span></p>
                `;

                document.getElementById('claimBtn').style.background = `linear-gradient(135deg, ${color} 0%, #fff 200%)`;
                document.getElementById('claimBtn').style.boxShadow = `0 4px 15px ${color}50`;
                document.getElementById('title').innerText = "CONTEÚDO DO BAÚ";
                document.getElementById('reveal').style.display = 'block';
            }, 1000);
        }

        function claim() {
            vscode.postMessage({ command: 'claimRewards' });
        }

        // Informa ao VS Code que a tela está pronta para receber os dados sorteados
        vscode.postMessage({ command: 'ready' });
    </script>
</body>
</html>

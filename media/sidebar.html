<!-- sidebar.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiji Drawer</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            background: #1e1a24;
            color: #ebd9c5;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: rgba(195, 131, 112, 0.15);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(195, 131, 112, 0.3);
        }

        .coins-text {
            font-size: 1.1em;
            font-weight: bold;
            color: #dfb15b;
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .main-btn {
            background: linear-gradient(135deg, #c38370 0%, #c78295 100%);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8em;
            text-transform: uppercase;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .theme-panel {
            display: none;
            background: rgba(43, 35, 48, 0.95);
            border: 1px solid #c38370;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 10px;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.3s forwards;
            flex-wrap: wrap;
            gap: 6px;
        }

        .palette-list {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .palette-dot {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
            display: none;
        }

        .palette-dot:hover {
            transform: scale(1.15);
        }

        .palette-dot.active {
            border-color: #dfb15b;
            box-shadow: 0 0 10px #dfb15b;
        }

        /* AMBIENTE ISOMÉTRICO ACOPLADO PERFEITAMENTE */
        .room-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            background: #141119;
            border: 2px solid #c38370;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.8);
            margin-bottom: 10px;
            padding-bottom: 25px;
            box-sizing: border-box;
        }

        .room-base {
            position: relative;
            width: 150px;
            height: 150px;
            transform: rotateX(60deg) rotateZ(-45deg);
            transform-style: preserve-3d;
            background-repeat: repeat;
            background-size: 32px 32px;
            transition: background 0.4s ease;
        }

        .wall-left {
            position: absolute;
            width: 150px;
            height: 110px;
            left: 0;
            top: -109.5px;
            transform-origin: bottom;
            transform: rotateX(-90deg);
            /* Erguido perfeitamente para cima e trás */
            transform-style: preserve-3d;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-color: rgba(143, 116, 95, 0.85);
            /* Cor de fallback visível */
            transition: background-color 0.4s ease, filter 0.4s ease;
            pointer-events: none;
        }

        .wall-right {
            position: absolute;
            width: 110px;
            height: 150px;
            left: 40px;
            top: 0;
            transform-origin: right;
            transform: rotateY(90deg);
            /* Erguido perfeitamente para cima e trás */
            transform-style: preserve-3d;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-color: rgba(123, 98, 78, 0.85);
            /* Cor de fallback visível */
            transition: background-color 0.4s ease, filter 0.4s ease;
            pointer-events: none;
        }

        .room-item {
            position: absolute;
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .item-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid transparent;
            transition: transform 0.2s, filter 0.2s;
        }

        .item-visual img {
            max-width: 32px;
            max-height: 48px;
            display: block;
        }

        .room-item:hover .item-visual {
            filter: drop-shadow(0 0 6px #dfb15b);
        }

        .room-item.selected .item-visual {
            filter: drop-shadow(0 0 10px #c78295);
            animation: pulse-select 1.5s infinite alternate;
        }

        .item-glow {
            width: 16px;
            height: 5px;
            background: rgba(223, 177, 91, 0.3);
            border-radius: 50%;
            filter: blur(2px);
            margin-top: -2px;
        }

        .placement-desk {
            left: 140px;
            top: 120px;
            z-index: 100;
            transform: translate(-50%, -100%) rotateZ(45deg) rotateX(-60deg) translateZ(60px);
        }

        .placement-floor {
            left: 80px;
            top: 180px;
            z-index: 50;
            transform: translate(-50%, -100%) rotateZ(45deg) rotateX(-60deg) translateZ(10px);
        }

        .placement-wall {
            left: 10px;
            top: 40px;
            z-index: 10;
            transform: translate(-50%, -100%) rotateZ(45deg) rotateX(-60deg) translateZ(100px);
        }


        .movement-controls {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: rgba(43, 35, 48, 0.95);
            border: 1px solid #c38370;
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 10px;
            animation: fadeIn 0.3s forwards;
        }

        .dpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            width: 105px;
        }

        .dpad-btn {
            background: #251e2b;
            border: 1px solid #c38370;
            color: #dfb15b;
            font-size: 1em;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }

        .dpad-btn:active {
            background: #c78295;
            color: #fff;
        }

        /* MENU DA LOJA */
        .shop-panel {
            position: fixed;
            top: 0;
            left: 100%;
            width: 100%;
            height: 100%;
            background: #1e1a24;
            z-index: 100;
            transition: left 0.3s ease;
            box-sizing: border-box;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .shop-panel.open {
            left: 0;
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .shop-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 12px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #c38370;
            padding: 6px;
            color: #fff;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.6em;
            text-transform: uppercase;
            font-weight: bold;
            text-align: center;
        }

        .tab-btn.active {
            background: #c38370;
        }

        .shop-list {
            flex: 1;
            overflow-y: auto;
        }

        .shop-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #3d3444;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            font-size: 0.6em;
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .rarity-comum {
            color: #8b949e;
            border: 1px solid #8b949e;
        }

        .rarity-incomum {
            color: #8faed6;
            border: 1px solid #8faed6;
        }

        .rarity-rara {
            color: #bc8cff;
            border: 1px solid #bc8cff;
        }

        .rarity-lendaria {
            color: #dfb15b;
            border: 1px solid #dfb15b;
        }

        button.buy-btn {
            background: #c38370;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: bold;
        }

        button.buy-btn:disabled {
            background: #2a2a35;
            color: #666;
            cursor: not-allowed;
        }

        /* GACHA */
        .chest-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 26, 36, 0.96);
            z-index: 200;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 15px;
            text-align: center;
        }

        .roulette-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .roulette-view {
            position: relative;
            width: 240px;
            height: 60px;
            border: 2px solid #c38370;
            border-radius: 8px;
            overflow: hidden;
            background: #251e2b;
            box-shadow: 0 0 15px rgba(195, 131, 112, 0.4);
        }

        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            transition: transform 3.5s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        .roulette-node {
            width: 80px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.65em;
            text-transform: uppercase;
            box-sizing: border-box;
            border-right: 1px solid rgba(0, 0, 0, 0.4);
        }

        .roulette-marker {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: #dfb15b;
            box-shadow: 0 0 8px #dfb15b;
            z-index: 10;
        }

        .gacha-result-container {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s forwards;
        }

        .chest {
            font-size: 80px;
            cursor: pointer;
            margin: 15px 0;
            display: inline-block;
            transition: transform 0.2s;
        }

        .chest.shake {
            animation: shake 0.6s infinite;
        }

        .chest.open {
            animation: popOpen 0.5s forwards;
        }

        .reward-reveal {
            display: none;
            animation: fadeIn 0.5s forwards;
        }

        .reward-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            min-width: 200px;
        }

        @keyframes shake {
            0% {
                transform: rotate(0);
            }

            20% {
                transform: rotate(-8deg);
            }

            40% {
                transform: rotate(8deg);
            }

            60% {
                transform: rotate(-8deg);
            }

            80% {
                transform: rotate(8deg);
            }

            100% {
                transform: rotate(0);
            }
        }

        @keyframes popOpen {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }

            100% {
                transform: scale(1);
                opacity: 0.1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-select {
            0% {
                border-color: #c78295;
            }

            100% {
                border-color: #dfb15b;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <span class="coins-text">💰 <span id="coinBalance">0</span></span>
        <div class="header-actions">
            <button class="main-btn" style="background:#251e2b; border:1px solid #c38370;"
                onclick="toggleThemePanel()">Pintar 🎨</button>
            <button class="main-btn" onclick="toggleShop(true)">Mochila 🎒</button>
        </div>
    </div>

    <!-- Opções de Pintura de parede e piso -->
    <div class="theme-panel" id="themePanel">
        <div
            style="display: flex; gap: 15px; align-items: center; width: 100%; justify-content: space-around; padding: 5px 0;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size:0.75em; font-weight:bold; color:#dfb15b; letter-spacing: 0.5px;">PAREDE:</span>
                <input type="color" id="wallColorPicker" value="#8f745f" oninput="changeWallColor(this.value)"
                    style="border: 1px solid #c38370; background: none; cursor: pointer; width: 32px; height: 24px; border-radius: 4px; padding: 0;">
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size:0.75em; font-weight:bold; color:#dfb15b; letter-spacing: 0.5px;">CHÃO:</span>
                <input type="color" id="floorColorPicker" value="#342764" oninput="changeFloorColor(this.value)"
                    style="border: 1px solid #c38370; background: none; cursor: pointer; width: 32px; height: 24px; border-radius: 4px; padding: 0;">
            </div>
        </div>
    </div>

    <div class="room-wrapper">
        <div class="room-base" id="roomBase">
            <div class="wall-left" id="wallLeft"></div>
            <div class="wall-right" id="wallRight"></div>
        </div>
    </div>

    <!-- Controle D-PAD para movimentação restrita -->
    <div class="movement-controls" id="movementPad">
        <div style="font-size:0.7em; margin-right:8px; text-align:center;">
            <div style="font-weight:bold; color:#c78295;">MOVER</div>
            <div id="selectedItemName"
                style="color:#aaa; max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Nenhum
            </div>
        </div>
        <div class="dpad-grid">
            <button class="dpad-btn" style="grid-column: 2;" onclick="moveItem('up')">▲</button>
            <button class="dpad-btn" style="grid-column: 1;" onclick="moveItem('left')">◀</button>
            <button class="dpad-btn" style="grid-column: 3;" onclick="moveItem('right')">▶</button>
            <button class="dpad-btn" style="grid-column: 2;" onclick="moveItem('down')">▼</button>
        </div>
        <!-- Controle de Elevação Vertical -->
        <div style="display:flex; flex-direction:column; align-items:center; gap:2px; margin-left:10px;">
            <span style="font-size:0.6em; font-weight:bold; color:#dfb15b; letter-spacing:0.3px;">ALTURA</span>
            <input type="range" id="elevationSlider" min="-100" max="100" value="0" style="width:60px; height:4px; accent-color:#dfb15b; cursor:pointer;" oninput="adjustElevation(this.value)">
            <span id="elevationVal" style="font-size:0.6em; color:#aaa; font-family:monospace;">0px</span>
        </div>
        <button class="main-btn" style="padding:4px 8px; font-size:0.7em; margin-left:8px;" onclick="deselectItem()">OK</button>
    </div>

    <div class="shop-panel" id="shopPanel">
        <div class="shop-header">
            <h3 style="margin: 0; color: #c38370; font-size: 1.1em; display: flex; align-items: center; gap: 6px;">🎒
                Mochila</h3>
            <button class="main-btn" onclick="toggleShop(false)">Fechar</button>
        </div>
        <div class="shop-list" id="shopList"></div>
    </div>

    <div class="chest-overlay" id="chestOverlay">
        <div class="roulette-wrapper" id="rouletteWrapper">
            <h3 style="margin-bottom: 12px; color: #dfb15b;" id="rouletteHeader">SORTEANDO RECOMPENSA...</h3>
            <div class="roulette-view">
                <div class="roulette-marker"></div>
                <div class="roulette-track" id="rouletteTrack"></div>
            </div>
        </div>

        <div class="gacha-result-container" id="gachaResultContainer">
            <h3 id="resultTitle" style="margin: 0;">RECOMPENSA REVELADA</h3>
            <div id="chestObj" class="chest" onclick="openChest()">🎁</div>
            <div id="rewardReveal" class="reward-reveal">
                <div id="rewardCard" class="reward-box"></div>
                <button class="main-btn" style="padding: 10px 25px;" onclick="claimRewards()">Resgatar</button>
            </div>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();

        /*CATALOG_PLACEHOLDER*/

        let localCoins = 0;
        let localInventory = [];
        let localPlaced = [];
        let localOffsets = {};
        let localTheme = 'yakuza';
        let currentTab = 'moveis';
        let currentReward = null;
        let chestOpened = false;
        let selectedItemId = null;
        let activeIntervals = [];

        let woodTileUrl = "";
        let grayTileUrl = "";
        let localWallUrl = "";

        const rarityColors = { comum: '#8b949e', incomum: '#8faed6', rara: '#bc8cff', lendaria: '#dfb15b' };

        function toggleThemePanel() {
            const panel = document.getElementById('themePanel');
            if (panel) {
                const isHidden = !panel.style.display || panel.style.display === 'none';
                panel.style.display = isHidden ? 'flex' : 'none';
            }
        }

        function updateWallVisual(color) {
            const wallLeft = document.getElementById('wallLeft');
            const wallRight = document.getElementById('wallRight');
            if (wallLeft && wallRight) {
                wallLeft.style.backgroundImage = 'none';
                wallRight.style.backgroundImage = 'none';
                wallLeft.style.backgroundColor = color;
                wallRight.style.backgroundColor = color;
            }
        }

        function updateFloorVisual(color) {
            const roomBase = document.getElementById('roomBase');
            if (roomBase) {
                roomBase.style.backgroundImage = 'none';
                roomBase.style.backgroundColor = color;
            }
        }

        function changeWallColor(color) {
            updateWallVisual(color);
            saveCustomColors();
        }

        function changeFloorColor(color) {
            updateFloorVisual(color);
            saveCustomColors();
        }

        function saveCustomColors() {
            const wallColor = document.getElementById('wallColorPicker').value;
            const floorColor = document.getElementById('floorColorPicker').value;
            
            vscode.postMessage({
                command: 'saveTheme',
                themeId: `custom|${wallColor}|${floorColor}`
            });
        }

        // Localize o bloco 'case "syncState":' na escuta de mensagens e substitua a chamada de applyTheme por esta:
        if (localTheme && localTheme.startsWith('custom|')) {
            const parts = localTheme.split('|');
            const savedWall = parts[1];
            const savedFloor = parts[2];

            document.getElementById('wallColorPicker').value = savedWall;
            document.getElementById('floorColorPicker').value = savedFloor;

            changeWallColor(savedWall);
            changeFloorColor(savedFloor);
        } else {
            changeWallColor('#8f745f');
            changeFloorColor('#342764');
        }

        function toggleShop(open) {
            const panel = document.getElementById('shopPanel');
            if (open) panel.classList.add('open');
            else panel.classList.remove('open');
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById('tab-' + tab).classList.add('active');
            renderInventory();
        }

        function renderInventory() {
            const list = document.getElementById('shopList');
            list.innerHTML = '';

            if (localInventory.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding: 40px 20px; color:#a28f80; font-size:0.85em;">Seu inventário está vazio.<br><br>Modifique e salve seus arquivos no VS Code para ganhar baús de decorações! 🎁</div>';
                return;
            }

            localInventory.forEach(itemId => {
                const item = catalog[itemId];
                if (item) {
                    const isPlaced = localPlaced.includes(itemId);
                    list.innerHTML += `
                        <div class="shop-item" style="border-color:#c78295;">
                            <div class="item-meta">
                                <div style="background:rgba(255,255,255,0.05); padding: 5px; border-radius: 4px; display:flex;">
                                    <img src="${item.icon}" style="max-width:24px; max-height:24px;" />
                                </div>
                                <div>
                                    <div style="font-weight:bold; font-size:0.85em;">${item.name}</div>
                                    <span class="badge rarity-${item.rarity}">${item.rarity}</span>
                                </div>
                            </div>
                            <button class="buy-btn" style="background:${isPlaced ? '#c78295' : '#8a9a86'}" onclick="togglePlacement('${item.id}')">
                                ${isPlaced ? 'Guardar' : 'Colocar'}
                            </button>
                        </div>
                    `;
                }
            });
        }

        function buy(itemId, cost) {
            vscode.postMessage({ command: 'buyItem', itemId: itemId, cost: cost });
        }

        function togglePlacement(itemId) {
            if (itemId === selectedItemId) {
                deselectItem();
            }
            vscode.postMessage({ command: 'togglePlacement', itemId: itemId });
        }

        function selectItem(itemId, name) {
            selectedItemId = itemId;
            document.querySelectorAll('.room-item').forEach(el => el.classList.remove('selected'));

            const selectedEl = document.getElementById('item-' + itemId);
            if (selectedEl) {
                selectedEl.classList.add('selected');
            }

            document.getElementById('selectedItemName').innerText = name;
            document.getElementById('movementPad').style.display = 'flex';
        }

        function deselectItem() {
            selectedItemId = null;
            document.querySelectorAll('.room-item').forEach(el => el.classList.remove('selected'));
            document.getElementById('movementPad').style.display = 'none';
        }


        function applyPositionOffset(element, offset) {
            // Posiciona a base do item na projeção isométrica do chão
            element.style.marginTop = offset.y + 'px';
            element.style.marginLeft = offset.x + 'px';
            
            // Move apenas o visual (sprite) para cima/baixo mantendo a sombra no chão
            const visual = element.querySelector('.item-visual');
            if (visual) {
                const z = offset.z || 0;
                visual.style.transform = `translateY(${z}px)`;
            }
        }

        function selectItem(itemId, name) {
            selectedItemId = itemId;
            document.querySelectorAll('.room-item').forEach(el => el.classList.remove('selected'));

            const selectedEl = document.getElementById('item-' + itemId);
            if (selectedEl) {
                selectedEl.classList.add('selected');
            }

            document.getElementById('selectedItemName').innerText = name;
            document.getElementById('movementPad').style.display = 'flex';

            // Sincroniza o slider de altura vertical
            const offset = localOffsets[itemId] || { x: 0, y: 0, z: 0 };
            const zVal = offset.z || 0;
            const slider = document.getElementById('elevationSlider');
            if (slider) {
                slider.value = zVal;
                document.getElementById('elevationVal').innerText = zVal + 'px';
            }
        }

        function adjustElevation(value) {
            if (!selectedItemId) return;
            const offset = localOffsets[selectedItemId] || { x: 0, y: 0, z: 0 };
            offset.z = parseInt(value) || 0;
            localOffsets[selectedItemId] = offset;

            const itemEl = document.getElementById('item-' + selectedItemId);
            if (itemEl) {
                applyPositionOffset(itemEl, offset);
            }

            document.getElementById('elevationVal').innerText = value + 'px';

            vscode.postMessage({
                command: 'saveOffset',
                itemId: selectedItemId,
                x: offset.x,
                y: offset.y,
                z: offset.z
            });
        }

        function moveItem(direction) {
            if (!selectedItemId) return;
            const item = catalog[selectedItemId];
            if (!item) return;

            let offset = localOffsets[selectedItemId] || { x: 0, y: 0, z: 0 };
            const step = 6;

            let newX = offset.x;
            let newY = offset.y;

            switch (direction) {
                case 'up': newY -= step; break;
                case 'down': newY += step; break;
                case 'left': newX -= step; break;
                case 'right': newX += step; break;
            }

            let minX = -65, maxX = 65, minY = -55, maxY = 55;
            if (item.placement === 'wall') {
                minX = -70; maxX = 70; minY = -75; maxY = 45;
            } else if (item.placement === 'desk') {
                minX = -50; maxX = 50; minY = -50; maxY = 50;
            }

            offset.x = Math.max(minX, Math.min(maxX, newX));
            offset.y = Math.max(minY, Math.min(maxY, newY));

            localOffsets[selectedItemId] = offset;

            const itemEl = document.getElementById('item-' + selectedItemId);
            if (itemEl) {
                applyPositionOffset(itemEl, offset);
            }

            vscode.postMessage({
                command: 'saveOffset',
                itemId: selectedItemId,
                x: offset.x,
                y: offset.y,
                z: offset.z || 0
            });
        }

        function clearAllIntervals() {
            activeIntervals.forEach(interval => clearInterval(interval));
            activeIntervals = [];
        }

        function setupAnimation(imgElement, framesArray, speed) {
            if (!framesArray || framesArray.length === 0) return;
            let currentFrameIdx = 0;
            const interval = setInterval(() => {
                currentFrameIdx = (currentFrameIdx + 1) % framesArray.length;
                imgElement.src = framesArray[currentFrameIdx];
            }, speed);
            activeIntervals.push(interval);
        }

        function setupSaveGacha(rewardData) {
            currentReward = rewardData;
            chestOpened = false;

            const overlay = document.getElementById('chestOverlay');
            overlay.style.display = 'flex';

            document.getElementById('gachaResultContainer').style.display = 'none';
            document.getElementById('rouletteWrapper').style.display = 'flex';

            const track = document.getElementById('rouletteTrack');
            track.innerHTML = '';
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';

            const segmentWidth = 80;

            const segmentsList = [
                { label: '💰 Moedas', color: rarityColors.comum, id: 'coins_comum' },
                { label: '📦 Baú Comum', color: rarityColors.comum, id: 'chest_comum' },
                { label: '💰 Moedas', color: rarityColors.incomum, id: 'coins_incomum' },
                { label: '📦 Baú Incomum', color: rarityColors.incomum, id: 'chest_incomum' },
                { label: '💰 Moedas', color: rarityColors.rara, id: 'coins_rara' },
                { label: '📦 Baú Rara', color: rarityColors.rara, id: 'chest_rara' },
                { label: '💰 Moedas', color: rarityColors.lendaria, id: 'coins_lendaria' },
                { label: '📦 Baú Lendário', color: rarityColors.lendaria, id: 'chest_lendaria' },
                { label: '🎨 Tema Cyber', color: rarityColors.rara, id: 'theme_cyber' },
                { label: '🎨 Tema Dusk', color: rarityColors.rara, id: 'theme_dusk' },
                { label: '🎨 Tema Sakura', color: rarityColors.lendaria, id: 'theme_sakura' },
                { label: '🎨 Tema Floresta', color: rarityColors.rara, id: 'theme_forest' },
                { label: '🎨 Tema Café', color: rarityColors.rara, id: 'theme_coffee' },
                { label: '🎨 Tema Nórdico', color: rarityColors.lendaria, id: 'theme_nordic' },
                { label: '🎨 Tema Gold', color: rarityColors.lendaria, id: 'theme_gold' }
            ];

            let targetId = "";
            if (currentReward.rollType === 'coins') {
                targetId = `coins_${currentReward.rarity}`;
            } else if (currentReward.rollType === 'chest') {
                targetId = `chest_${currentReward.rarity}`;
            } else {
                targetId = `theme_${currentReward.rolledItem.id}`;
            }

            const totalSlots = 35;
            for (let i = 0; i < totalSlots; i++) {
                let slotData;
                if (i === 28) {
                    slotData = segmentsList.find(s => s.id === targetId) || segmentsList[0];
                } else {
                    slotData = segmentsList[Math.floor(Math.random() * segmentsList.length)];
                }

                const node = document.createElement('div');
                node.className = 'roulette-node';
                node.style.background = `linear-gradient(to bottom, #251e2b, ${slotData.color}25)`;
                node.style.color = slotData.color;
                node.innerHTML = `<span>${slotData.label.split(' ')[0]}</span><span style="font-size:0.8em; margin-top:2px;">${slotData.label.split(' ')[1]}</span>`;
                track.appendChild(node);
            }

            track.offsetHeight;

            const targetIndex = 28;
            const targetItemCenter = (targetIndex * segmentWidth) + (segmentWidth / 2);
            const containerCenter = 120;
            const stopOffset = containerCenter - targetItemCenter;

            setTimeout(() => {
                track.style.transition = 'transform 3.5s cubic-bezier(0.1, 0.8, 0.1, 1)';
                track.style.transform = `translateX(${stopOffset}px)`;
            }, 50);

            setTimeout(() => {
                document.getElementById('rouletteWrapper').style.display = 'none';
                revealAward();
            }, 3800);
        }

        function revealAward() {
            const container = document.getElementById('gachaResultContainer');
            const color = rarityColors[currentReward.rarity];
            const chestObj = document.getElementById('chestObj');
            const card = document.getElementById('rewardCard');
            const revealArea = document.getElementById('rewardReveal');

            container.style.display = 'flex';

            if (currentReward.rollType === 'coins') {
                chestObj.style.display = 'none';
                document.getElementById('resultTitle').innerText = "MOEDAS CONQUISTADAS!";
                document.getElementById('resultTitle').style.color = color;

                card.style.border = `1px solid ${color}`;
                card.style.boxShadow = `0 0 10px ${color}30`;
                card.innerHTML = `
                    <p style="font-size: 1.8em; font-weight: bold; margin: 10px 0;">💰 +${currentReward.coinReward} Moedas</p>
                    <p style="margin: 0; font-size: 0.8em; color: #a28f80;">Sorteio da Roleta: Moedas Diretas!</p>
                `;
                revealArea.style.display = 'block';
            } else if (currentReward.rollType === 'theme') {
                chestObj.style.display = 'none';
                document.getElementById('resultTitle').innerText = "ESTILO DESBLOQUEADO!";
                document.getElementById('resultTitle').style.color = color;

                card.style.border = `1px solid ${color}`;
                card.style.boxShadow = `0 0 10px ${color}30`;
                card.innerHTML = `
                    <p style="font-size: 1.4em; font-weight: bold; margin: 10px 0; color:#c78295;">🎨 ${currentReward.rolledItem.name}</p>
                    <p style="margin: 0; font-size: 0.8em; color: #a28f80;">Use o botão "Pintar" para equipar o novo ambiente!</p>
                `;
                revealArea.style.display = 'block';
            } else {
                chestObj.style.display = 'inline-block';
                chestObj.innerText = "🎁";
                chestObj.className = "chest";
                chestObj.style.filter = `drop-shadow(0 0 15px ${color})`;

                document.getElementById('resultTitle').innerText = `BAÚ ${currentReward.rarity.toUpperCase()}`;
                document.getElementById('resultTitle').style.color = color;

                revealArea.style.display = 'none';
            }
        }

        function openChest() {
            if (chestOpened || !currentReward) return;
            chestOpened = true;

            const chest = document.getElementById('chestObj');
            chest.classList.add('shake');

            setTimeout(() => {
                chest.classList.remove('shake');
                chest.classList.add('open');
                chest.innerText = "🔓";

                const color = rarityColors[currentReward.rarity];
                const card = document.getElementById('rewardCard');
                card.style.border = `1px solid ${color}`;
                card.style.boxShadow = `0 0 10px ${color}30`;
                card.innerHTML = `
                    <p style="font-size: 1.5em; font-weight: bold; margin: 5px 0;">💰 +${currentReward.coinReward} Moedas</p>
                    <p style="margin: 0; font-size: 0.8em; color: #ccc; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;">Sorteio da Caixa: <span style="display:flex; align-items:center; justify-content:center; gap:5px; color:${color}; font-weight:bold;"><img src="${currentReward.rolledItem.icon}" style="max-width:24px; max-height:24px;" /> ${currentReward.rolledItem.name}</span></p>
                `;

                document.getElementById('resultTitle').innerText = "RECOMPENSA REVELADA";
                document.getElementById('rewardReveal').style.display = 'block';
            }, 1000);
        }

        function claimRewards() {
            if (!currentReward) return;
            vscode.postMessage({
                command: 'saveRewards',
                amount: currentReward.coinReward,
                itemId: currentReward.rolledItem ? currentReward.rolledItem.id : null
            });
            document.getElementById('chestOverlay').style.display = 'none';
            currentReward = null;
        }

        window.addEventListener('message', event => {
            const data = event.data;
            switch (data.command) {
                case 'syncState':
                    localCoins = data.coins;
                    localInventory = data.inventory;
                    localPlaced = data.placed || [];
                    localOffsets = data.offsets || {};
                    localTheme = data.theme || 'yakuza';
                    const unlockedThemes = data.unlockedThemes || ['yakuza'];

                    woodTileUrl = data.woodTileUri;
                    grayTileUrl = data.grayTileUri;
                    localWallUrl = data.wallUri;

                    document.getElementById('coinBalance').innerText = localCoins;
                    renderInventory();

                    clearAllIntervals();

                    // Sincroniza o piso e as paredes sem disparar o salvamento redundante de mensagens
                    if (localTheme && localTheme.startsWith('custom|')) {
                        const parts = localTheme.split('|');
                        const savedWall = parts[1];
                        const savedFloor = parts[2];

                        document.getElementById('wallColorPicker').value = savedWall;
                        document.getElementById('floorColorPicker').value = savedFloor;

                        updateWallVisual(savedWall);
                        updateFloorVisual(savedFloor);
                    } else {
                        document.getElementById('wallColorPicker').value = '#8f745f';
                        document.getElementById('floorColorPicker').value = '#342764';
                        updateWallVisual('#8f745f');
                        updateFloorVisual('#342764');
                    }

                    document.querySelectorAll('.palette-dot').forEach(dot => {
                        const themeId = dot.id.replace('dot-', '');
                        if (unlockedThemes.includes(themeId)) {
                            dot.style.display = 'block';
                        } else {
                            dot.style.display = 'none';
                        }
                    });

                    // Renderização de objetos isométricos no cenário
                    const room = document.getElementById('roomBase');
                    document.querySelectorAll('.room-item').forEach(el => el.remove());

                    localPlaced.forEach(itemId => {
                        const item = catalog[itemId];
                        if (item) {
                            const itemEl = document.createElement('div');
                            itemEl.className = 'room-item placement-' + item.placement;
                            itemEl.id = 'item-' + item.id;

                            const offset = localOffsets[item.id] || { x: 0, y: 0 };
                            applyPositionOffset(itemEl, offset);

                            itemEl.innerHTML = `
                                <div class="item-visual" title="${item.name}">
                                    <img id="img-${item.id}" src="${item.icon}" style="filter: drop-shadow(0 0 4px ${rarityColors[item.rarity]}30);" />
                                </div>
                                <div class="item-glow" style="background: ${rarityColors[item.rarity]}40;"></div>
                            `;

                            itemEl.onclick = (e) => {
                                e.stopPropagation();
                                selectItem(item.id, item.name);
                            };

                            room.appendChild(itemEl);

                            if (item.animationFrames && item.animation) {
                                const imgEl = document.getElementById('img-' + item.id);
                                setupAnimation(imgEl, item.animationFrames, item.animation.speed);
                            }
                        }
                    });

                    if (selectedItemId && !localPlaced.includes(selectedItemId)) {
                        deselectItem();
                    }
                    break;

                case 'triggerChest':
                    setupSaveGacha(data);
                    break;
            }
        });

        document.getElementById('roomBase').onclick = () => {
            deselectItem();
        };

        vscode.postMessage({ command: 'ready' });
    </script>
</body>

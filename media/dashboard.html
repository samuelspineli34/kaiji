<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meu Espaço</title>
    <style>
        body {
            background: #090714;
            color: white;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            gap: 20px;
        }
        .main-content {
            flex: 1.4;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .sidebar-shop {
            flex: 1;
            background: rgba(21, 17, 48, 0.7);
            border: 2px solid #7000ff;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(112,0,255,0.25);
        }
        .isometric-container {
            position: relative;
            width: 100%;
            height: 420px;
            background: #151130;
            border: 2px solid #7000ff;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
        }
        .room-base {
            position: relative;
            width: 300px;
            height: 300px;
            transform: rotateX(60deg) rotateZ(-45deg);
            transform-style: preserve-3d;
            background: #2a2050;
            box-shadow: 10px 10px 40px rgba(0,0,0,0.5);
        }
        .wall-left {
            position: absolute;
            width: 300px;
            height: 150px;
            background: #392c6e;
            transform: rotateX(-90deg) translateZ(-150px) translateY(-75deg);
            transform-style: preserve-3d;
            border-bottom: 3px solid #00f0ff;
        }
        .wall-right {
            position: absolute;
            width: 150px;
            height: 300px;
            background: #20173e;
            transform: rotateY(90deg) translateZ(150px) translateX(-75deg);
            transform-style: preserve-3d;
            border-bottom: 3px solid #00f0ff;
        }
        .room-item {
            position: absolute;
            transform-style: preserve-3d;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .item-visual {
            font-size: 45px;
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.4));
            animation: float 3s ease-in-out infinite alternate;
        }
        .item-glow {
            width: 25px;
            height: 10px;
            background: rgba(0, 240, 255, 0.4);
            border-radius: 50%;
            filter: blur(4px);
            margin-top: -5px;
        }
        .placement-desk { left: 140px; top: 120px; z-index: 100; transform: rotateZ(45deg) rotateX(-60deg) translateZ(60px); }
        .placement-floor { left: 80px; top: 180px; z-index: 50; transform: rotateZ(45deg) rotateX(-60deg) translateZ(10px); }
        .placement-wall { left: 10px; top: 40px; z-index: 10; transform: rotateZ(45deg) rotateX(-60deg) translateZ(100px); }

        .shop-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid #7000ff;
            padding: 10px;
            color: #fff;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8em;
        }
        .tab-btn.active {
            background: #7000ff;
            box-shadow: 0 0 10px rgba(112,0,255,0.5);
        }
        .shop-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
        .shop-item {
            background: rgba(0,0,0,0.25);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .item-meta {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .badge {
            font-size: 0.7em;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .rarity-comum { color: #888; border: 1px solid #888; }
        .rarity-incomum { color: #00aaff; border: 1px solid #00aaff; }
        .rarity-rara { color: #aa00ff; border: 1px solid #aa00ff; }
        .rarity-lendaria { color: #ffaa00; border: 1px solid #ffaa00; background: rgba(255, 170, 0, 0.1); }
        
        button.buy-btn {
            background: #7000ff;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button.buy-btn:disabled {
            background: #2a2a35;
            color: #666;
            cursor: not-allowed;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>
    <div class="main-content">
        <h2 style="margin: 0; color: #00f0ff;">💰 Saldo: <span id="coinBalance" style="color: #fff;">0</span> Moedas</h2>
        
        <div class="isometric-container">
            <div class="room-base" id="roomBase">
                <div class="wall-left"></div>
                <div class="wall-right"></div>
            </div>
        </div>
    </div>

    <div class="sidebar-shop">
        <h3 style="margin-top: 0; color: #ff007f;">🛒 Loja de Decoração</h3>
        <div class="shop-tabs">
            <button class="tab-btn active" onclick="switchTab('moveis')">Móveis</button>
            <button class="tab-btn" onclick="switchTab('eletronicos')">Aparelhos</button>
            <button class="tab-btn" onclick="switchTab('decoracao')">Outros</button>
        </div>
        <div class="shop-list" id="shopList"></div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        
        // Injetado dinamicamente pelo backend
        /*CATALOG_PLACEHOLDER*/

        let currentTab = 'moveis';
        let localCoins = 0;
        let localInventory = [];

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('onclick').includes(tab)) btn.classList.add('active');
            });
            renderShop();
        }

        function renderShop() {
            const list = document.getElementById('shopList');
            list.innerHTML = '';

            Object.values(catalog)
                .filter(item => item.category === currentTab)
                .forEach(item => {
                    const isOwned = localInventory.includes(item.id);
                    list.innerHTML += `
                        <div class="shop-item">
                            <div class="item-meta">
                                <span style="font-size: 2.2em;">${item.emoji}</span>
                                <div>
                                    <div style="font-weight:bold;">${item.name}</div>
                                    <span class="badge rarity-${item.rarity}">${item.rarity}</span>
                                </div>
                            </div>
                            <button class="buy-btn" ${isOwned ? 'disabled' : ''} onclick="buy('${item.id}', ${item.cost})">
                                ${isOwned ? 'Adquirido' : item.cost + ' 💰'}
                            </button>
                        </div>
                    `;
                });
        }

        function buy(itemId, cost) {
            vscode.postMessage({ command: 'buyItem', itemId: itemId, cost: cost });
        }

        window.addEventListener('message', event => {
            const data = event.data;
            if (data.command === 'syncState') {
                localCoins = data.coins;
                localInventory = data.inventory;
                
                document.getElementById('coinBalance').innerText = localCoins;
                renderShop();

                const room = document.getElementById('roomBase');
                document.querySelectorAll('.room-item').forEach(el => el.remove());

                localInventory.forEach(itemId => {
                    const item = catalog[itemId];
                    if (item) {
                        const itemEl = document.createElement('div');
                        itemEl.className = `room-item placement-${item.placement}`;
                        itemEl.innerHTML = `
                            <div class="item-visual" title="${item.name}">${item.emoji}</div>
                            <div class="item-glow"></div>
                        `;
                        room.appendChild(itemEl);
                    }
                });
            }
        });

        vscode.postMessage({ command: 'ready' });
    </script>
</body>
</html>
